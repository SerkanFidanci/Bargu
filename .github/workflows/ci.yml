name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    name: Format · Typecheck · Lint · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json#packageManager. Node comes from
      # package.json#devEngines.runtime, which pnpm installs and uses for every script.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: No invisible or bidi-control characters (Trojan Source)
        run: pnpm check:chars

      - name: Typecheck, lint, test, build
        run: pnpm exec turbo run typecheck lint test build --ui=stream

  integration:
    name: API integration (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Same images (pinned by digest) and test-only credentials as infra/docker-compose.yml.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-tests-only
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:integration-tests-only@127.0.0.1:5433/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests (auth, sessions, RLS, passkeys, attestation, worker, migrations)
        run: pnpm exec turbo run test:integration --filter=@bargu/api --ui=stream

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: pnpm audit (high and critical fail the build)
        run: pnpm audit --audit-level high

  swift-compat:
    name: Swift (CryptoKit) cross-implementation
    # The iOS Notification Service Extension decrypts with Apple CryptoKit; prove it opens what the
    # TypeScript implementation produces (packages/crypto/fixtures).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift test
        working-directory: packages/crypto/swift
        run: swift test

  deploy-staging:
    name: Deploy staging
    needs: [verify, integration, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-staging.yml
    # Reusable workflows only see secrets the caller names (least privilege: just this one). The value
    # comes from the `staging` environment inside the called job.
    secrets:
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
