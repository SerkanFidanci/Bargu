name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'
  TURBO_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  verify:
    name: Format · Typecheck · Lint · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json#packageManager. Node comes from
      # package.json#devEngines.runtime, which pnpm installs and uses for every script.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck, lint, test, build
        run: pnpm exec turbo run typecheck lint test build --ui=stream

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: pnpm audit (high and critical fail the build)
        run: pnpm audit --audit-level high

  swift-compat:
    name: Swift (CryptoKit) cross-implementation
    # The iOS Notification Service Extension decrypts with Apple CryptoKit; prove it opens what the
    # TypeScript implementation produces (packages/crypto/fixtures).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift test
        working-directory: packages/crypto/swift
        run: swift test

  deploy-staging:
    name: Deploy staging
    needs: [verify, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-staging.yml
    # Reusable workflows only see secrets the caller names (least privilege: just this one). The value
    # comes from the `staging` environment inside the called job.
    secrets:
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
