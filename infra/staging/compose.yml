# Staging stack on the VPS (see infra/vps/README.md). Deployed by infra/staging/deploy.sh:
#   docker compose --env-file .env --env-file image.env up -d --wait
# Only Caddy publishes ports. Postgres and Redis sit on an internal network with no route out.
name: bargu-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      API_DOMAIN: ${API_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set in .env}
    ports:
      # Explicit 0.0.0.0: the daemon default binds published ports to 127.0.0.1 (cloud-init).
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
      - 0.0.0.0:443:443/udp
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    image: ${API_IMAGE:?set by deploy.sh in image.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
      # Only Caddy (on the edge network) may set X-Forwarded-For.
      TRUST_PROXY: 172.30.10.0/24
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 256
    networks: [edge, backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 128m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction --protected-mode yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  backend:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
