# Staging stack on the shared server (see infra/vps/README.md). Deployed by infra/staging/deploy.sh:
#   docker compose --env-file .env --env-file image.env up -d --wait
# TLS and the public ports belong to the host's nginx (infra/staging/nginx/bargu-staging.conf).
# The API is published on 127.0.0.1 only; Postgres and Redis sit on an internal network.
name: bargu-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  api:
    <<: *hardening
    image: ${API_IMAGE:?set by deploy.sh in image.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
      # Host nginx reaches the published port through Docker's proxy, i.e. from the ingress gateway.
      TRUST_PROXY: 10.89.10.1
    ports:
      - 127.0.0.1:${API_HOST_PORT:-3100}:3000
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 256
    networks: [ingress, backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 128m
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --protected-mode yes
    volumes:
      - redis-data:/data
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  # Fixed subnet outside Docker's default pools and the host's routes, so TRUST_PROXY is exact.
  ingress:
    ipam:
      config:
        - subnet: 10.89.10.0/24
          gateway: 10.89.10.1
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
