# Staging stack on the shared server (see infra/vps/README.md). Deployed by infra/staging/deploy.sh:
#   docker compose --env-file .env --env-file image.env run --rm migrate
#   docker compose --env-file .env --env-file image.env up -d --wait
# TLS and the public ports belong to the host's nginx (infra/staging/nginx/bargu-staging.conf).
# The API is published on 127.0.0.1 only; everything else sits on an internal network.
name: bargu-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

# The API image runs as three processes: API (default command), worker, one-shot migration.
x-app: &app
  <<: *hardening
  image: ${API_IMAGE:?set by deploy.sh in image.env}
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  pids_limit: 256

# Shared by API and worker. The runtime role bargu_app owns nothing and cannot bypass RLS; the
# superuser credentials are given to the migrate service only.
x-app-env: &app-env
  NODE_ENV: production
  APP_ENV: staging
  LOG_LEVEL: info
  DATABASE_URL: postgres://bargu_app:${DB_APP_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  REDIS_URL: redis://default:${REDIS_PASSWORD:?}@redis:6379
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?}
  OTP_KEY: ${OTP_KEY:?}
  EMAIL_LOOKUP_KEY: ${EMAIL_LOOKUP_KEY:?}
  JOB_PAYLOAD_KEY: ${JOB_PAYLOAD_KEY:?}
  # Mailpit (internal) by default; `bargu-set-mail` (set-mail.sh) points it at a Gmail account until
  # a real relay and domain exist: docs/ADR/0006.
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  # Test accounts (`*.test`, never deliverable) always land in Mailpit, whatever SMTP_URL is.
  SMTP_TEST_URL: smtp://mailpit:1025
  MAIL_FROM: ${MAIL_FROM:-Bargu <no-reply@bargu.invalid>}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?}
  WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:?}
  ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
  # Push notifications (docs/ADR/0010): set with `bargu-set-push`; empty means off.
  FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
  # Store accounts (Apple, Google Play) do not exist yet; production requires attestation.
  DEVICE_ATTESTATION: optional
  # Test purchases (docs/ADR/0024 §6): off unless .env says BILLING_TEST=on; never in production.
  BILLING_TEST: ${BILLING_TEST:-off}
  # Background live mode (docs/ADR/0028 step 3): staging sends the silent `watch` notice to members
  # whose app is closed (the code's own default is off). Per recipient: one every
  # WATCH_PUSH_MIN_SECONDS and WATCH_PUSH_PER_HOUR an hour.
  WATCH_PUSH: ${WATCH_PUSH:-on}
  WATCH_PUSH_MIN_SECONDS: ${WATCH_PUSH_MIN_SECONDS:-90}
  WATCH_PUSH_PER_HOUR: ${WATCH_PUSH_PER_HOUR:-20}
  # The oldest app served (QA 19 P4): 0 serves all; raise it in .env to make old APKs update.
  MIN_CLIENT_LEVEL: ${MIN_CLIENT_LEVEL:-0}
  # Signs cosmetic passes (docs/ADR/0025): staging's own key, generated on the server into .env.
  ENTITLEMENT_SIGNING_KEY: ${ENTITLEMENT_SIGNING_KEY:-}
  ENTITLEMENT_SIGNING_KID: ${ENTITLEMENT_SIGNING_KID:-}

services:
  migrate:
    <<: *app
    restart: 'no'
    # Only run on demand by deploy.sh, never by `up`.
    profiles: [tools]
    command: ['dist/db/migrate-cli.js']
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      # Written into the database on every run (app.settings, docs/ADR/0024 §6): test purchases
      # count there only where these say so, as for the API.
      APP_ENV: staging
      BILLING_TEST: ${BILLING_TEST:-off}
    healthcheck:
      disable: true
    mem_limit: 256m
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '3000'
      # Host nginx reaches the published port through Docker's proxy, i.e. from the ingress gateway.
      TRUST_PROXY: 10.89.10.1
    ports:
      - 127.0.0.1:${API_HOST_PORT:-3100}:3000
    mem_limit: 512m
    networks: [ingress, backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ['dist/worker.js']
    environment: *app-env
    # No HTTP server: the image's API health check does not apply.
    healthcheck:
      disable: true
    mem_limit: 384m
    # egress: the only service that talks to the outside (mail relay, push service); nothing
    # listens on it.
    networks: [backend, egress]
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      MP_MAX_MESSAGES: 200
    mem_limit: 128m
    # Internal only: read messages with `docker exec` on the server, nothing is published.
    networks: [backend]

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    shm_size: 128m
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --protected-mode yes
    volumes:
      - redis-data:/data
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  # Fixed subnet outside Docker's default pools and the host's routes, so TRUST_PROXY is exact.
  ingress:
    ipam:
      config:
        - subnet: 10.89.10.0/24
          gateway: 10.89.10.1
  backend:
    internal: true
  egress: {}

volumes:
  postgres-data:
  redis-data:
