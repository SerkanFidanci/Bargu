# Bargu staging API on the host's nginx. Installed by infra/vps/setup-nginx.sh, which replaces
# __API_DOMAIN__ and __API_PORT__. Self-contained: it does not change any other site on the host.

# Only WebSocket upgrades reach the API. Forwarding arbitrary Upgrade values (e.g. h2c) would allow
# request smuggling past the location rules below.
map $http_upgrade $bargu_upgrade {
    default         "";
    "~*^websocket$" websocket;
}

map $bargu_upgrade $bargu_connection {
    default   "";
    websocket upgrade;
}

# Cache-Control of the self-hosted map files (/map/ below). A whole file (200) and its
# revalidation (304) keep the long cache; every other answer is "no-store": above all the 404 for a
# file that is not on the server yet (world.pmtiles before infra/staging/apply-pending.sh), which a
# phone that asked too early would otherwise keep for a day, and the 403 and the like.
# add_header with `always` adds its field to every response code (nginx.org,
# ngx_http_headers_module), so the value is chosen here from the response code ($status,
# ngx_http_core_module).
# Answers to a Range request (the 206 of a PMTiles read) are "no-store" too, and the 416 is why:
# nginx adds the headers BEFORE its range filter decides between 206 and 416 (so $status is still
# 200 then, whatever the range turns out to be), and an unsatisfiable range is answered by a second
# pass that adds the headers once more. A line cannot be taken back, so the first pass must already
# say what is right for the 416 (no-store), and the second pass must add nothing: the map is
# `volatile` (not cached per request, ngx_http_map_module) so it is asked again then, and for 416
# the empty value makes add_header skip the field. Measured with nginx 1.24: one Cache-Control
# line on every answer. The price: HTTP caches keep no 206 (the app's MapLibre PMTiles source
# keeps none either).
map "$status:$http_range" $bargu_map_cache_control {
    volatile;
    default          "no-store";
    "~^(200|304):$"  "public, max-age=86400";
    "~^416:"         "";
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # Privacy: no access log (it would record client IPs and raw URLs, which may carry tokens).
    access_log off;
    client_max_body_size 1m;

    # One HSTS header for every response, including nginx's own (404, 502).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Dependency status is for the host (healthcheck, deploy script), not the internet.
    location = /health/ready {
        return 404;
    }

    # Self-hosted map files (Faz 3, docs/ADR/0008): vector tiles (one PMTiles archive read with
    # range requests), label fonts and icons, installed by infra/vps/setup-map.sh. Static and
    # public; the phone never asks a third party for map data, so nobody else learns the viewport.
    location /map/ {
        alias /srv/bargu-map/public/;
        autoindex off;
        # Range requests on the archive must see the bytes as stored.
        gzip off;
        types {
            application/vnd.pmtiles pmtiles;
            application/x-protobuf pbf;
            application/json json;
            image/png png;
        }
        default_type application/octet-stream;
        # add_header in a location replaces the server-level ones, so HSTS is repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Long cache for a whole file (200, 304), "no-store" for everything else (the map at the top of this file).
        add_header Cache-Control $bargu_map_cache_control always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Test builds of the Android app (scripts/publish-apk.sh), while there is no store listing. Each
    # file has an unguessable name; nothing lists the folder.
    location /apk/ {
        alias /srv/bargu-apk/public/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade is restricted to "websocket" by the map above (the mitigation this rule asks for)
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket upgrade only (Faz 5 realtime relay); empty values drop the headers.
        proxy_set_header Upgrade $bargu_upgrade;
        proxy_set_header Connection $bargu_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
