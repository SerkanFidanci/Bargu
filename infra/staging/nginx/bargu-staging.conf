# Bargu staging API on the host's nginx. Installed by infra/vps/setup-nginx.sh, which replaces
# __API_DOMAIN__ and __API_PORT__. Self-contained: it does not change any other site on the host.

# Only WebSocket upgrades reach the API. Forwarding arbitrary Upgrade values (e.g. h2c) would allow
# request smuggling past the location rules below.
map $http_upgrade $bargu_upgrade {
    default         "";
    "~*^websocket$" websocket;
}

map $bargu_upgrade $bargu_connection {
    default   "";
    websocket upgrade;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # Privacy: no access log (it would record client IPs and raw URLs, which may carry tokens).
    access_log off;
    client_max_body_size 1m;

    # One HSTS header for every response, including nginx's own (404, 502).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Dependency status is for the host (healthcheck, deploy script), not the internet.
    location = /health/ready {
        return 404;
    }

    # Self-hosted map files (Faz 3, docs/ADR/0008): vector tiles (one PMTiles archive read with
    # range requests), label fonts and icons, installed by infra/vps/setup-map.sh. Static and
    # public; the phone never asks a third party for map data, so nobody else learns the viewport.
    location /map/ {
        alias /srv/bargu-map/public/;
        autoindex off;
        # Range requests on the archive must see the bytes as stored.
        gzip off;
        types {
            application/vnd.pmtiles pmtiles;
            application/x-protobuf pbf;
            application/json json;
            image/png png;
        }
        default_type application/octet-stream;
        # add_header in a location replaces the server-level ones, so HSTS is repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade is restricted to "websocket" by the map above (the mitigation this rule asks for)
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket upgrade only (Faz 5 realtime relay); empty values drop the headers.
        proxy_set_header Upgrade $bargu_upgrade;
        proxy_set_header Connection $bargu_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
