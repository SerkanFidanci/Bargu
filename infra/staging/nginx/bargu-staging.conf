# Bargu staging API on the host's nginx. Installed by infra/vps/setup-nginx.sh, which replaces
# __API_DOMAIN__ and __API_PORT__. Self-contained: it does not change any other site on the host.

map $http_upgrade $bargu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # Privacy: no access log (it would record client IPs and raw URLs, which may carry tokens).
    access_log off;
    client_max_body_size 1m;

    # One HSTS header for every response, including nginx's own (404, 502).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Dependency status is for the host (healthcheck, deploy script), not the internet.
    location = /health/ready {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket upgrade (Faz 5 realtime relay).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bargu_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
