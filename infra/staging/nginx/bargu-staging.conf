# Bargu staging API on the host's nginx. Installed by infra/vps/setup-nginx.sh, which replaces
# __API_DOMAIN__ and __API_PORT__. Self-contained: it does not change any other site on the host.

# Only WebSocket upgrades reach the API. Forwarding arbitrary Upgrade values (e.g. h2c) would allow
# request smuggling past the location rules below.
map $http_upgrade $bargu_upgrade {
    default         "";
    "~*^websocket$" websocket;
}

map $bargu_upgrade $bargu_connection {
    default   "";
    websocket upgrade;
}

# Cache-Control of the self-hosted map files (/map/ below). The map files keep their long cache
# (200 whole file, 206 range read, 304 revalidation); the other answers, above all the 404 for a
# file that is not on the server yet (world.pmtiles before infra/staging/apply-pending.sh), must
# never be kept, or a phone that asked too early would not see the file for a day. add_header with
# `always` adds its field to every response code (nginx.org, ngx_http_headers_module), so the value
# is chosen by the response code here ($status, ngx_http_core_module).
# The 416 (a range past the end of a file) keeps its Cache-Control line TWICE, both the long cache,
# as it did before this map; that is on purpose. Measured with nginx 1.24: nginx adds the headers
# before its range filter decides between 206 and 416 ($status is still 200 then) and builds a 416
# in a second pass that adds them again, so a 416 entry in this map changes nothing (the variable
# is cached per request and the first pass already put the long cache on). One "no-store" line on a
# 416 is only possible by making every answer to a Range request no-store, i.e. every 206, i.e. every
# PMTiles read of the Turkey map and the world map, which anything that honours Cache-Control (the
# ambient cache of MapLibre, say) would then fetch again on every view. A 416 only happens for a
# range past the end of a file (a client with a stale size), so a doubled line there is cosmetic and
# that price is not worth paying.
map $status $bargu_map_cache_control {
    default "no-store";
    200     "public, max-age=86400";
    206     "public, max-age=86400";
    304     "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # Invite links over plain http (path form /i/<token> and /g/<token>, docs/ADR/0009 Ek): still
    # redirected to https, but the token must not reach a log. This server has no access_log of its
    # own, so the host's access log would take the whole URL; `access_log off` cancels it for these
    # two paths (nginx.org, ngx_http_log_module).
    location ~* ^/(i|g)/ {
        access_log off;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __API_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__API_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__API_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;

    # Privacy: no access log (it would record client IPs and raw URLs, which may carry tokens).
    access_log off;
    client_max_body_size 1m;

    # One HSTS header for every response, including nginx's own (404, 502).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Dependency status is for the host (healthcheck, deploy script), not the internet.
    location = /health/ready {
        return 404;
    }

    # Self-hosted map files (Faz 3, docs/ADR/0008): vector tiles (one PMTiles archive read with
    # range requests), label fonts and icons, installed by infra/vps/setup-map.sh. Static and
    # public; the phone never asks a third party for map data, so nobody else learns the viewport.
    location /map/ {
        alias /srv/bargu-map/public/;
        autoindex off;
        # Range requests on the archive must see the bytes as stored.
        gzip off;
        types {
            application/vnd.pmtiles pmtiles;
            application/x-protobuf pbf;
            application/json json;
            image/png png;
        }
        default_type application/octet-stream;
        # add_header in a location replaces the server-level ones, so HSTS is repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Long cache for 200/206/304, "no-store" for everything else (the map at the top of this file).
        add_header Cache-Control $bargu_map_cache_control always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Test builds of the Android app (scripts/publish-apk.sh), while there is no store listing. Each
    # file has an unguessable name; nothing lists the folder.
    location /apk/ {
        alias /srv/bargu-apk/public/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Invite links, path form (https://<host>/i/<token> and /g/<token>, docs/ADR/0009 Ek): the token
    # is in the URL, so these two are never access-logged. `access_log off` in a location of its own
    # cancels the access_log of every level above (nginx.org, ngx_http_log_module); the server above
    # has it off already, this keeps it so if a log is ever switched on for the whole server. The
    # error log stays (it is the host's; it names the request line when something fails). Apart from
    # that this is exactly the `/` block below, copied: same upstream, headers and timeouts, so the
    # API still answers these paths itself (its rate limit, its headers, its CSP).
    location ~* ^/(i|g)/ {
        access_log off;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade is restricted to "websocket" by the map above (the mitigation this rule asks for)
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket upgrade only (Faz 5 realtime relay); empty values drop the headers.
        proxy_set_header Upgrade $bargu_upgrade;
        proxy_set_header Connection $bargu_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- Upgrade is restricted to "websocket" by the map above (the mitigation this rule asks for)
        proxy_set_header Host $host;
        # Overwrite (never append to) client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # WebSocket upgrade only (Faz 5 realtime relay); empty values drop the headers.
        proxy_set_header Upgrade $bargu_upgrade;
        proxy_set_header Connection $bargu_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
