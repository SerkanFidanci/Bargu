# Local development dependencies. Usage (from the repo root):
#   cp infra/.env.example infra/.env   # once
#   pnpm infra:up                      # postgres + redis + mailpit, waits until healthy
# Ports are bound to 127.0.0.1 only; nothing here is reachable from the network.
name: bargu-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in infra/.env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  redis:
    image: redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in infra/.env}
      # Picked up by redis-cli in the healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set in infra/.env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025 # SMTP
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025 # Web UI
    logging: *logging

volumes:
  postgres-data:
  redis-data:
