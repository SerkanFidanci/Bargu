packages:
  - apps/*
  - packages/*

# --- Supply chain -------------------------------------------------------------------------------
# Strict quarantine: versions younger than 24 h are never installed (setting it explicitly makes the
# check strict). Routine updates arrive through Renovate, which waits 7 days (renovate.json); this
# will be raised to 7 days once every lockfile entry is older than that (see docs/ADR/0001).
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

# Transitive dependencies may only come from the registry (no git URLs or tarballs).
blockExoticSubdeps: true

# Fail when a release carries weaker publish evidence (trusted publishing / provenance) than an
# earlier release of the same package: the signature of a stolen-token publish. Releases older than
# 7 days are exempt; by then a takeover would normally have been detected and unpublished.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude:
  # Reviewed 2026-10-13. Expo publishes SDK 58 via GitHub OIDC but SDK 57 maintenance releases with
  # a maintainer token, so pnpm reports a downgrade. Verified for every entry: same npm publisher as
  # all earlier 57.x releases; gitHead expo/expo@50ac74f ("Publish packages", 2026-10-06) lists
  # exactly these versions; no public compromise report. Redundant after 2026-10-13 12:16 UTC
  # (trustPolicyIgnoreAfter) — remove at the next dependency update.
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - 'babel-preset-expo@57.0.14'
  - 'expo-asset@57.0.19'
  - 'expo-constants@57.0.21'
  - 'expo-dev-menu@57.0.19'
  - 'expo-linking@57.0.12'
  - 'expo-modules-autolinking@57.0.14'
  - 'expo-modules-core@57.0.21'
  - 'expo-router@57.0.25'
  - 'expo@57.0.27'

# Install scripts are deny-by-default (strictDepBuilds). Every entry here must be reviewed.
allowBuilds:
  # Nest CLI SWC builder; postinstall only verifies the platform binary.
  '@swc/core': true
  # Skia (map effects, docs/ADR/0013): postinstall only copies the prebuilt libraries from its own
  # react-native-skia-android / -apple-* packages into libs/ (no network, no commands; audited).
  '@shopify/react-native-skia': true
  # Fallback downloader for the native binding, which already arrives via optionalDependencies.
  unrs-resolver: false

# Exact versions in package.json; the lockfile is the source of truth.
savePrefix: ''

# @bacons/apple-targets (iOS notification extension target, docs/ADR/0016) reaches an old @expo/plist
# whose @xmldom/xmldom 0.7 has ReDoS / injection advisories. Same API as the @expo/plist Expo SDK 57
# itself uses (xmldom 0.8.15, patched); only read at prebuild time on our own Info.plist files.
overrides:
  '@bacons/xcode>@expo/plist': 0.8.1

# Audit exceptions: only advisories with no patched release, reviewed and justified. Re-check on every
# Expo SDK upgrade; remove an entry as soon as a fix ships (Renovate will propose the bump).
audit:
  ignore:
    # node-forge <=1.4.0 RSA PKCS#1 v1.5 signature forgery (CVE-2026-85393). Reviewed 2026-10-13:
    # reached only via @expo/cli (dev server / build tooling), never bundled into the app, and no
    # Bargu flow verifies third-party RSA signatures with it. No fixed version exists yet.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3 stack exhaustion on deeply nested patterns (CVE-2026-93687). Reviewed 2026-10-13:
    # reached only via Metro's file map (bundler, dev/build time); patterns come from our own config,
    # not from users. No fixed version exists yet.
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6 can exhaust memory validating oversized constrained collections. Reviewed 2026-10-27:
    # our own zod (api, mobile, schemas) is 4.6.6, patched; the only vulnerable copy is 3.25.76 inside
    # @expo/cli (dev server and build tooling, never bundled into the app), validating our own config.
    # The fix exists only in zod 4, a different API @expo/cli 57 cannot take. Remove with Expo SDK 58.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component <=0.5.0 quadratic time on long runs of percent-encoded input (DoS).
    # Reviewed 2026-10-29: reached via expo-router > query-string 7, which parses the app's own
    # links (bargu:// and https invite links) in the app. The fix (0.5.1) is ESM-only and
    # query-string 7 require()s it, so forcing it would break link parsing; expo-router 57 has no
    # newer query-string. Worst case a crafted link hangs the app of whoever opens it until it is
    # closed: no data leaves, nothing is stored. Remove when Expo SDK 58 ships a fixed query-string.
    - GHSA-qr28-fpjm-wq7f
